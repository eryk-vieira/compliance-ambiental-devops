# =============================================================================
# docker-compose.production.yml - ambiente de PRODUÇÃO
#
# Usado pelo job "deploy-production" do pipeline (após aprovação do ambiente
# "production" no GitHub) e por scripts/deploy.sh production.
# Diferenças em relação ao staging: porta 8082, banco/volume/rede próprios,
# ASPNETCORE_ENVIRONMENT=Production, imagem com tag ":production" do GHCR,
# banco sem porta exposta ao host e limites de recursos.
#
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d --wait
# =============================================================================
name: compliance-production

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: compliance-prod-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env.production}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    # Em produção o banco NÃO é publicado no host: só a API o acessa pela rede interna.
    expose:
      - "1433"
    volumes:
      - mssql-data-production:/var/opt/mssql
    networks:
      - compliance-prod-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: always

  api:
    image: ${API_IMAGE:-compliance-ambiental-api:production}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-production-local}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
        APP_BUILD_NUMBER: ${APP_BUILD_NUMBER:-local}
    container_name: compliance-prod-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      APP_ENVIRONMENT: "production"
      APP_VERSION: ${APP_VERSION:-production-local}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
      APP_BUILD_NUMBER: ${APP_BUILD_NUMBER:-local}
      APP_DEPLOYED_AT: ${APP_DEPLOYED_AT:-}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-ComplianceAmbiental};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: ${JWT_ISSUER:-ComplianceAmbiental.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-ComplianceAmbiental.Client}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env.production}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES:-60}
    ports:
      - "${API_PORT:-8082}:8080"
    networks:
      - compliance-prod-net
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

volumes:
  mssql-data-production:

networks:
  compliance-prod-net:
    driver: bridge
